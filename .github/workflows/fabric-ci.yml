name: Fabric CI (Pilot)

on:
  push:
    branches: [ 'dev', 'main', 'feature/**' ]
  pull_request:
    branches: [ 'staging', 'main' ]
  workflow_dispatch:   # ใช้กับ job dq-gate-poc ด้านล่าง — manual trigger เท่านั้นตอนนี้

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # ต้องมีสิทธิ์นี้ถึงจะ comment ตาราง summary ลง PR ได้
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      # ไม่ต้องรู้จัก Fabric item type ทุกตัว — อ่านแค่ "check pattern" ที่ item นั้นแม็ปไว้ใน ci-config.yml
      # เพิ่ม item type ใหม่ = เพิ่ม entry ใน ci-config.yml เท่านั้น ไม่ต้องแก้ไฟล์นี้
      #
      # หา item folder แบบ recursive ผ่านไฟล์ .platform (marker ของ Fabric item จริง) แทนการ glob
      # fabric_items/*/ ระดับเดียว — เพราะ Fabric workspace folder (เช่น /yayee, /fern) ทำให้ item
      # อยู่ลึกกว่า 1 ชั้นได้ (fabric_items/<folder>/<item>.<Type>/) glob ระดับเดียวจะมองไม่เห็น item เลย
      #
      # scan ทั้ง fabric_items/ (Git Integration ของ spl-cicd-dev) และ fabric_items_endpoint/
      # (Git Integration แยกต่างหากของ spl-cicd-endpoint-dev — section 14 Phase 6 Test B)
      # 2>/dev/null เผื่อโฟลเดอร์ใดโฟลเดอร์หนึ่งยังไม่มีอยู่
      - name: Run checks based on declared pattern
        run: |
          missing=0
          while IFS= read -r platform_file; do
            item="$(dirname "$platform_file")/"
            folder=$(basename "$item")
            name="${folder%.*}"
            fabric_type=$(yq ".${name}.fabric_type // \"${folder##*.}\"" ci-config.yml)

            # opt-out รายตัว ใช้ได้กับทุก pattern — ต้องระบุเหตุผลเสมอ ไม่ปล่อยผ่านแบบเงียบๆ
            skip=$(yq ".${name}.skip_check // false" ci-config.yml)
            if [ "$skip" = "true" ]; then
              reason=$(yq ".${name}.skip_reason // \"NO REASON GIVEN\"" ci-config.yml)
              if [ "$reason" = "NO REASON GIVEN" ]; then
                echo "::error::[$name] skip_check=true but skip_reason is missing in ci-config.yml"
                missing=1
              else
                echo "::notice::[$name] check skipped — reason: $reason"
              fi
              continue
            fi

            # ลำดับ: override เฉพาะ item -> default ตาม fabric_type ใน _defaults -> unit_test (fail-safe เข้มสุด)
            # แยกเป็น 2 คำสั่ง yq ต่อกัน (ไม่ใช้ // สองอันในคำสั่งเดียว) เพราะ // เดี่ยวๆ พิสูจน์แล้วว่าใช้ได้จริงใน CI
            # ส่วน // สองชั้นต่อกันยังไม่มีตัวอย่างยืนยันจาก yq docs ว่ารองรับแน่นอน
            check=$(yq ".${name}.check // \"\"" ci-config.yml)
            if [ -z "$check" ]; then
              check=$(yq "._defaults.${fabric_type} // \"unit_test\"" ci-config.yml)
            fi

            case "$check" in
              unit_test)
                if [ ! -f "tests/unit/test_${name}.py" ]; then
                  echo "::error::[$name] check=unit_test but no test found (expected tests/unit/test_${name}.py)"
                  missing=1
                else
                  pytest "tests/unit/test_${name}.py"
                fi
                ;;

              data_quality)
                if [ ! -f "great_expectations/checkpoints/dq_${name}.yml" ]; then
                  echo "::error::[$name] check=data_quality but no checkpoint found (expected great_expectations/checkpoints/dq_${name}.yml)"
                  missing=1
                else
                  great_expectations checkpoint run "dq_${name}"
                fi
                ;;

              structure)
                if [ ! -f "scripts/validate_pipeline_structure.py" ]; then
                  echo "::error::[$name] check=structure but scripts/validate_pipeline_structure.py is missing"
                  missing=1
                else
                  python scripts/validate_pipeline_structure.py "$item"
                fi
                ;;

              schema)
                if [ ! -f "scripts/validate_schema_contract.py" ]; then
                  echo "::error::[$name] check=schema but scripts/validate_schema_contract.py is missing"
                  missing=1
                else
                  python scripts/validate_schema_contract.py "$item"
                fi
                ;;

              none)
                echo "::notice::[$name] check=none — no automated check configured (declared intentionally in ci-config.yml)"
                ;;

              *)
                echo "::error::[$name] unknown check pattern '$check' in ci-config.yml"
                missing=1
                ;;
            esac
          done < <(find fabric_items fabric_items_endpoint -name ".platform" 2>/dev/null | sort)
          if [ "$missing" -eq 1 ]; then
            echo "::error::Some items failed required checks — see log above"
            exit 1
          fi

      - name: Generate check summary table
        if: always()
        run: |
          pass_count=0
          fail_count=0
          skip_count=0
          rows=""

          while IFS= read -r platform_file; do
            item="$(dirname "$platform_file")/"
            folder=$(basename "$item")
            name="${folder%.*}"

            fabric_type=$(yq ".${name}.fabric_type // \"${folder##*.}\"" ci-config.yml)
            # ลำดับเดียวกับ step "Run checks based on declared pattern" ด้านบน — ต้องตรงกันเสมอ
            check=$(yq ".${name}.check // \"\"" ci-config.yml)
            if [ -z "$check" ]; then
              check=$(yq "._defaults.${fabric_type} // \"unit_test\"" ci-config.yml)
            fi
            skip=$(yq ".${name}.skip_check // false" ci-config.yml)

            if [ "$skip" = "true" ]; then
              reason=$(yq ".${name}.skip_reason // \"\"" ci-config.yml)
              status="⏭️ **Skipped** — $reason"
              skip_count=$((skip_count + 1))
            else
              case "$check" in
                unit_test)
                  if [ -f "tests/unit/test_${name}.py" ]; then
                    status="✅ **Pass**"; pass_count=$((pass_count + 1))
                  else
                    status="❌ **Missing test**"; fail_count=$((fail_count + 1))
                  fi
                  ;;
                data_quality)
                  if [ -f "great_expectations/checkpoints/dq_${name}.yml" ]; then
                    status="✅ **Pass**"; pass_count=$((pass_count + 1))
                  else
                    status="❌ **Missing checkpoint**"; fail_count=$((fail_count + 1))
                  fi
                  ;;
                structure)
                  if [ -f "scripts/validate_pipeline_structure.py" ]; then
                    status="✅ **Pass**"; pass_count=$((pass_count + 1))
                  else
                    status="❌ **Missing script**"; fail_count=$((fail_count + 1))
                  fi
                  ;;
                schema)
                  if [ -f "scripts/validate_schema_contract.py" ]; then
                    status="✅ **Pass**"; pass_count=$((pass_count + 1))
                  else
                    status="❌ **Missing script**"; fail_count=$((fail_count + 1))
                  fi
                  ;;
                none)
                  status="⏭️ **Skipped** — no check declared (intentional)"
                  skip_count=$((skip_count + 1))
                  ;;
                *)
                  status="⚠️ **Unknown pattern**"
                  fail_count=$((fail_count + 1))
                  ;;
              esac
            fi

            rows="${rows}| \`$name\` | $fabric_type | \`$check\` | $status |"$'\n'
          done < <(find fabric_items fabric_items_endpoint -name ".platform" 2>/dev/null | sort)

          {
            echo "## 🔍 Fabric Item Check Summary"
            echo ""
            if [ "$fail_count" -gt 0 ]; then
              echo "### ❌ $fail_count check(s) need attention before merge"
            else
              echo "### ✅ All checks passing — $pass_count passed, $skip_count skipped"
            fi
            echo ""
            echo "| Item | Fabric Type | Check Pattern | Status |"
            echo "|---|---|---|---|"
            printf '%s' "$rows"
            echo ""
            echo "<sub>Commit \`${GITHUB_SHA::7}\` · [View full run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})</sub>"
          } > "$RUNNER_TEMP/check_summary.md"

          # $GITHUB_STEP_SUMMARY เป็นไฟล์แยกกันคนละไฟล์ในแต่ละ step (GitHub รวมให้ทีหลังตอนแสดง Job Summary)
          # step อื่นที่มาอ่านทีหลัง (เช่น step post-comment) จะอ่านจาก $GITHUB_STEP_SUMMARY ไม่ได้เพราะเป็นไฟล์คนละอันกับตอนเขียน
          # เก็บสำเนาไว้ที่ $RUNNER_TEMP ด้วย เพื่อให้ step ถัดไปอ่านเนื้อหาเดิมที่ตรงกันได้จริง
          cat "$RUNNER_TEMP/check_summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post check summary as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = path.join(process.env.RUNNER_TEMP, 'check_summary.md');
            const summary = fs.readFileSync(summaryPath, 'utf8');
            const marker = '<!-- fabric-item-check-summary -->';
            const body = `${marker}\n${summary}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production   # ต้องไปสร้าง environment ชื่อ "production" ใน Settings → Environments
                               # แล้วเพิ่ม Required reviewers ก่อน ไม่งั้น deploy จะรันทันทีไม่มีใครเช็คก่อน
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Deploy to Fabric (production)
        run: python scripts/deploy.py --workspace 84cc9682-9946-44a6-83b4-9275ebfb9834 --environment prod
        env:
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}

  # section 14 Phase 6: cross-workspace pipeline → endpoint deploy — job เดียวจัดการ
  # endpoint item ทุกตัว (ไม่ว่าจะเป็น Test A แบบ shared authoring หรือ Test B แบบ
  # independent git channel) โดยอ่าน endpoint-targets.yml ผ่าน scripts/deploy_endpoints.py
  # เพิ่ม endpoint item ใหม่ในอนาคต = เพิ่ม entry ใน endpoint-targets.yml เท่านั้น
  # ไม่ต้องมาเพิ่ม job ใหม่ในไฟล์นี้อีก (เดิมมี 3 job แยกกันต่อ item ซึ่งไม่ scale)
  #
  # จงใจไม่ใส่ needs: deploy-prod เพื่อให้รันพร้อมกัน (parallel) กับ deploy-prod จริง
  # ไม่ใช่รอต่อคิว — ส่วน item หลายตัวภายใน job นี้เอง (ถ้ามีหลาย endpoint พร้อมกัน)
  # จะ deploy เรียงกันไปทีละตัว (sequential) ไม่ใช่ parallel กันเอง แลกกับความง่ายในการ
  # ดูแล ถ้าอนาคตมี endpoint จำนวนมากจนรอไม่ไหว ค่อยพิจารณาทำเป็น matrix job แทน
  deploy-endpoints:
    needs: test
    if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Deploy endpoint items (from endpoint-targets.yml)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENVIRONMENT=prod
          else
            ENVIRONMENT=dev
          fi
          python scripts/deploy_endpoints.py --environment "$ENVIRONMENT"
        env:
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}

  # Live DQ-gate POC — พิสูจน์ว่า GX check ที่รันจริงบน Fabric (Spark) ผ่าน nb_dqgate_check
  # (เรียกจาก pl_dqgate_test) ทำให้ pipeline job instance fail จริงถ้าข้อมูลเสีย ต่างจาก
  # check pattern data_quality เดิมที่เช็คแค่ CSV fixture ในเครื่อง CI runner เอง ไม่แตะ Fabric
  # เลย (ดู great_expectations/checkpoints/dq_TEMPLATE.yml กับ DataOps-CICD-Workflow.md
  # section 14) — nb_dqgate_check/pl_dqgate_test/lh_dqgate_test ถูก skip_check ไว้ใน
  # ci-config.yml เพราะเช็คผ่าน job นี้แทน ไม่ใช่ static definition check
  #
  # ตั้งใจให้ trigger แบบ manual (workflow_dispatch) เท่านั้นตอนนี้ ไม่ auto-run ทุก push —
  # เนื้อหา notebook (GX check) และการต่อสาย Notebook Activity ใน pipeline ยังต้องทำผ่าน
  # Fabric UI ให้เสร็จก่อน (item ถูกสร้างเป็น shell เปล่าผ่าน Fabric API ไว้แล้ว) พอ verify
  # end-to-end ผ่านทั้งเคส good/bad data แล้วค่อยพิจารณาเปลี่ยนเป็น auto-trigger
  dq-gate-poc:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run live DQ gate against pl_dqgate_test (spl-cicd-dev)
        run: python scripts/run_live_dq_gate.py --workspace 7a829f6b-4fd1-45c7-8c8e-b7c317816e4b --pipeline-name pl_dqgate_test
        env:
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
